[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant"
version = "1.0.0"
description = "Offline voice assistant: Whisper speech-to-text, a scikit-learn intent classifier, rule-based entity extraction and a pluggable skill system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20240930",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
va = "voice_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
